<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IronLog diagnóstico</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #111;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #000;
        border: 1px solid #333;
        padding: 12px;
        border-radius: 8px;
      }
      #app:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="out">coletando…</pre>
    <script>
      const out = document.getElementById('out');
      const lines = [];
      const log = (label, value) => {
        lines.push(label + ': ' + value);
        out.textContent = lines.join('\n');
      };
      log('URL', location.href);
      log('em iframe', window.top !== window.self);
      log('origem', location.origin);
      log('contexto seguro', window.isSecureContext);
      log('indexedDB', typeof indexedDB);
      log('crypto.subtle', Boolean(window.crypto && window.crypto.subtle));
      log('serviceWorker', 'serviceWorker' in navigator);
      log('navegador', navigator.userAgent);

      window.addEventListener('error', (event) => log('erro global', event.message));
      window.addEventListener('unhandledrejection', (event) =>
        log('promise rejeitada', String(event.reason)),
      );

      import('/src/main.tsx')
        .then(() => log('import main.tsx', 'OK'))
        .catch((error) => log('import main.tsx', 'FALHOU: ' + error.message));

      fetch('/src/main.tsx')
        .then((response) => log('main.tsx content-type', response.headers.get('content-type')))
        .catch((error) => log('main.tsx content-type', 'erro: ' + error.message));

      fetch('/@vite/client')
        .then((response) => log('servidor Vite', response.ok ? 'SIM' : 'NÃO (status ' + response.status + ')'))
        .catch(() => log('servidor Vite', 'NÃO (sem /@vite/client)'));

      setTimeout(() => {
        const app = document.getElementById('app');
        log('app renderizou', app && app.textContent ? app.textContent.slice(0, 120) : 'NÃO');
      }, 6000);
    </script>
  </body>
</html>
