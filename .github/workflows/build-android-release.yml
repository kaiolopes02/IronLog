name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (vazio = build-<run_number>)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar e publicar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar componentes do Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar APK para a release
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ironlog-apk-debug.apk

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironlog-apk
          path: android/app/build/outputs/apk/debug/ironlog-apk-debug.apk
          if-no-files-found: error

      - name: Publicar na GitHub Release
        env:
          APK_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('build-{0}', github.run_number) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_TAG }}
          target_commitish: ${{ github.sha }}
          name: IronLog ${{ env.APK_TAG }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/ironlog-apk-debug.apk
          fail_on_unmatched_files: true
